spring.application.name=transfer

# Server configuration
server.port=${PORT:8080}

# Datasource SQLite
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.url=jdbc:sqlite:${DB_PATH:./data/transfer.db}

# JPA / Hibernate for SQLite
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# File upload limits
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:500MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE:500MB}
spring.servlet.multipart.enabled=true

# Custom application properties
transfer.upload-dir=${UPLOAD_DIR:./uploads}
transfer.retention-days=${RETENTION_DAYS:30}
# Espacio total máximo de los ficheros subidos (MB, 0 = sin límite) y espacio libre mínimo en disco (MB)
transfer.max-storage-mb=${MAX_STORAGE_MB:10240}
transfer.min-free-disk-mb=${MIN_FREE_DISK_MB:1024}
# Admin inicial: si la clave está vacía se genera una aleatoria y se muestra una vez en el log
transfer.initial-admin.username=${INITIAL_ADMIN_USER:admin}
transfer.initial-admin.password=${INITIAL_ADMIN_PASS:}
# Bloqueo por IP tras varios intentos de login fallidos
transfer.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
transfer.login.lock-minutes=${LOGIN_LOCK_MINUTES:15}

# Sesión
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Thymeleaf
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Reverse proxy support (Apache / Nginx con X-Forwarded-For, X-Forwarded-Proto y X-Forwarded-Prefix)
server.forward-headers-strategy=framework
